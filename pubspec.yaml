name: marine_aqua_technologies
description: Marine Aqua Technologies - Smart Aquaculture. Better Results.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  image_picker: ^1.2.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/products/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/products/marine_app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/products/marine_app_icon.png"
