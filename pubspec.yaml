name: marine_aqua_technologies
description: MARINE AQUA TECHNOLOGIES - Smart Aquaculture. Better Results.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/products/
    - assets/
    - assets/success_stories/
    - assets/success_stories/thumbs/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/products/marine logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/products/marine logo.png"
